<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeWord - Trigger Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1f2937, #111827);
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 36px 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .btn-emergency {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
      border: 2px solid #f87171;
      border-radius: 12px;
      padding: 18px 32px;
      font-size: 1.25rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }
    .btn-emergency:hover {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
    }
    .btn-emergency:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.4);
    }
    .btn-emergency:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    #status-msg {
      margin-top: 20px;
      font-size: 0.95rem;
      min-height: 24px;
      color: #cbd5e1;
    }
    .results-card {
      margin-top: 24px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      text-align: left;
      display: none;
    }
    .results-card.visible {
      display: block;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #1e293b;
      font-size: 0.95rem;
    }
    .result-row:last-child {
      border-bottom: none;
    }
    .label {
      color: #94a3b8;
      font-weight: 500;
    }
    .value {
      color: #38bdf8;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .error-box {
      margin-top: 20px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SafeWord Emergency Test</h1>
    <p class="subtitle">Direct testing utility for the emergency trigger module</p>

    <button id="triggerBtn" class="btn-emergency" onclick="handleEmergencyClick()">
      🚨 Test Emergency Trigger
    </button>

    <div id="status-msg">Click the button to test GPS detection</div>

    <div id="resultsCard" class="results-card">
      <div class="result-row">
        <span class="label">Latitude</span>
        <span id="resLatitude" class="value">-</span>
      </div>
      <div class="result-row">
        <span class="label">Longitude</span>
        <span id="resLongitude" class="value">-</span>
      </div>
      <div class="result-row">
        <span class="label">Timestamp</span>
        <span id="resTimestamp" class="value">-</span>
      </div>
      <div class="result-row">
        <span class="label">Contact</span>
        <span id="resContact" class="value">-</span>
      </div>
    </div>

    <div id="errorBox" class="error-box"></div>
  </div>

  <script src="trigger.js"></script>
  <script>
    async function handleEmergencyClick() {
      const btn = document.getElementById("triggerBtn");
      const statusMsg = document.getElementById("status-msg");
      const resultsCard = document.getElementById("resultsCard");
      const errorBox = document.getElementById("errorBox");

      btn.disabled = true;
      errorBox.style.display = "none";
      statusMsg.textContent = "⏳ Requesting GPS coordinates and generating alert...";

      try {
        const alertData = await triggerEmergency();

        if (alertData) {
          document.getElementById("resLatitude").textContent = alertData.latitude;
          document.getElementById("resLongitude").textContent = alertData.longitude;
          document.getElementById("resTimestamp").textContent = alertData.timestamp;
          document.getElementById("resContact").textContent = alertData.contact;

          resultsCard.classList.add("visible");
          statusMsg.textContent = "✅ Emergency trigger executed successfully!";
        } else {
          statusMsg.textContent = "⚠️ triggerEmergency() finished without returning data.";
        }
      } catch (err) {
        errorBox.textContent = `Error: ${err.message || err}`;
        errorBox.style.display = "block";
        statusMsg.textContent = "❌ Failed to trigger emergency.";
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
